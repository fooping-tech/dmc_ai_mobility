<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>web_nav2_ui</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #map { border: 1px solid #888; image-rendering: pixelated; }
    .row { margin: 8px 0; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h3>Nav2 Web UI (MVP)</h3>
  <div class="row">Status: <span id="status">idle</span></div>
  <div class="row">
    Goal yaw(deg): <input id="yaw" type="number" value="0" />
    <button id="reload">Reload Map</button>
    <button id="modeSingle">Single Goal</button>
    <button id="modeWp">Waypoint Add</button>
  </div>
  <canvas id="map" width="600" height="600"></canvas>
  <p>Single Goal: クリックで即送信 / Waypoint Add: クリックで蓄積</p>

  <div class="row">
    <button id="runWp">Run Waypoints</button>
    <button id="clearWp">Clear Waypoints</button>
  </div>
  <pre id="wpList" style="background:#f3f3f3;padding:8px;max-width:600px;white-space:pre-wrap"></pre>

<script>
let mapData = null;
let mode = 'single';
let waypoints = [];
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const wpListEl = document.getElementById('wpList');

async function fetchMap() {
  const r = await fetch('/api/map');
  if (!r.ok) throw new Error('map not ready');
  mapData = await r.json();
  drawMap();
}

function drawMap() {
  if (!mapData) return;
  const {width, height, data} = mapData;
  const img = ctx.createImageData(width, height);
  for (let i=0; i<data.length; i++) {
    const v = data[i];
    let c = 200;
    if (v < 0) c = 120;
    else if (v > 50) c = 0;
    const idx = i * 4;
    img.data[idx] = c;
    img.data[idx+1] = c;
    img.data[idx+2] = c;
    img.data[idx+3] = 255;
  }

  const tmp = document.createElement('canvas');
  tmp.width = width;
  tmp.height = height;
  tmp.getContext('2d').putImageData(img, 0, 0);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

function canvasToMap(cx, cy) {
  const {width, height, resolution, origin} = mapData;
  const mx = cx / canvas.width * width;
  const my = (canvas.height - cy) / canvas.height * height;
  return {
    x: origin.x + mx * resolution,
    y: origin.y + my * resolution,
  }
}

async function sendGoal(x, y, yaw_deg) {
  const r = await fetch('/api/goal', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({x, y, yaw_deg})
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t);
  }
}

async function runWaypoints() {
  const r = await fetch('/api/waypoints/run', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({waypoints})
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t);
  }
}

function renderWaypoints() {
  if (waypoints.length === 0) {
    wpListEl.textContent = 'waypoints: (empty)';
    return;
  }
  wpListEl.textContent = waypoints.map((p, i) => `${i+1}. x=${p.x.toFixed(2)}, y=${p.y.toFixed(2)}, yaw=${p.yaw_deg.toFixed(1)}deg`).join('\n');
}

canvas.addEventListener('click', async (ev) => {
  if (!mapData) return;
  const rect = canvas.getBoundingClientRect();
  const cx = ev.clientX - rect.left;
  const cy = ev.clientY - rect.top;
  const p = canvasToMap(cx, cy);
  const yaw = Number(document.getElementById('yaw').value || 0);

  if (mode === 'wp') {
    waypoints.push({x: p.x, y: p.y, yaw_deg: yaw});
    renderWaypoints();
    document.getElementById('status').textContent = `wp added (${p.x.toFixed(2)}, ${p.y.toFixed(2)})`;
    return;
  }

  try {
    await sendGoal(p.x, p.y, yaw);
    document.getElementById('status').textContent = `goal sent (${p.x.toFixed(2)}, ${p.y.toFixed(2)})`;
  } catch (e) {
    document.getElementById('status').textContent = `send failed: ${e.message}`;
  }
});

document.getElementById('reload').onclick = fetchMap;
document.getElementById('modeSingle').onclick = () => {
  mode = 'single';
  document.getElementById('status').textContent = 'mode: single goal';
};
document.getElementById('modeWp').onclick = () => {
  mode = 'wp';
  document.getElementById('status').textContent = 'mode: waypoint add';
};
document.getElementById('clearWp').onclick = () => {
  waypoints = [];
  renderWaypoints();
};
document.getElementById('runWp').onclick = async () => {
  if (waypoints.length === 0) {
    document.getElementById('status').textContent = 'no waypoints';
    return;
  }
  try {
    await runWaypoints();
    document.getElementById('status').textContent = `waypoint run started (${waypoints.length})`;
  } catch (e) {
    document.getElementById('status').textContent = `run failed: ${e.message}`;
  }
};

async function pollStatus() {
  try {
    const r = await fetch('/api/goal/status');
    const s = await r.json();
    document.getElementById('status').textContent = `${s.status} ${s.detail || ''}`;
  } catch {}
}

renderWaypoints();
fetchMap().catch(e => {
  document.getElementById('status').textContent = `map wait: ${e.message}`;
});
setInterval(pollStatus, 1000);
</script>
</body>
</html>
